name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest

  face:
    name: Face-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the InsightFace model pack
        uses: actions/cache@v6
        with:
          path: ~/.insightface
          key: insightface-buffalo_l-v1
      - name: Install with the face extra
        run: pip install -e ".[dev,face]"
      - name: Pytest (real face model on the fixtures)
        run: pytest -m face -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t avatartrace:ci .
      - name: Version
        run: docker run --rm avatartrace:ci --version
      - name: Optional dependencies import
        run: >
          docker run --rm --entrypoint python avatartrace:ci
          -c "import cv2, insightface, onnxruntime, fastapi, uvicorn; print('imports ok')"
      - name: Offline comparison inside the container
        run: |
          docker run --rm -v "$PWD/tests/fixtures:/fx:ro" avatartrace:ci \
            compare /fx/logo.png /fx/logo_resized.jpg --no-face | tee /tmp/compare.txt
          grep -q "NEAR-DUPLICATE" /tmp/compare.txt
