[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "avatartrace"
dynamic = ["version"]
description = "Find the accounts that use the same (or a very similar) profile picture: reverse-image discovery, then local hash and face verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "avatartrace contributors" }]
keywords = [
    "osint",
    "reverse-image-search",
    "face-recognition",
    "catfish-detection",
    "perceptual-hash",
    "impersonation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pillow>=10.3",
    "imagehash>=4.3.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
# InsightFace code is MIT, but its pretrained model packs (buffalo_*) are
# licensed for non-commercial research use only. See README, "Face matching".
face = ["insightface>=0.7.3", "onnxruntime>=1.17"]
clip = ["fastembed>=0.5"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
all = ["avatartrace[face,clip,web]"]
dev = [
    "avatartrace[web]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[project.scripts]
avatartrace = "avatartrace.cli:app"

[project.urls]
Homepage = "https://github.com/harelhz/avatartrace"
Issues = "https://github.com/harelhz/avatartrace/issues"

[tool.hatch.version]
path = "src/avatartrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/avatartrace"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CONTRIBUTING.md", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "face: needs the optional InsightFace extra and its model pack",
    "clip: needs the optional CLIP extra and its model",
    "live: talks to the real internet (never run in CI)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "PT", "RET", "RUF", "S", "ASYNC", "PTH", "TID"]
ignore = [
    "S101",   # asserts are fine in tests and for narrowing
    "S311",   # no cryptographic randomness needed
    "RUF001", # the UI intentionally uses a few typographic characters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"scripts/**" = ["S", "T20"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["imagehash", "imagehash.*", "insightface", "insightface.*", "fastembed", "fastembed.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
follow_imports = "skip"
